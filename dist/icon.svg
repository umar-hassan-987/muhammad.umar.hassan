<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base Squircle with Emerald Glow -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="#040404" stroke="url(#emeraldGrad)" stroke-width="12" />
  
  <!-- Sleek Glowing AI & Code Symbol (Stylized U) -->
  <g fill="none" stroke="url(#emeraldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Left wing of U (brackets motif) -->
    <path d="M 190,150 L 150,190 L 150,300 C 150,360 200,380 256,380" />
    <!-- Right wing of U (brackets motif) -->
    <path d="M 322,150 L 362,190 L 362,300 C 362,360 312,380 256,380" />
    <!-- Connection lines representing neural network / code flow -->
    <path d="M 256,180 L 256,260" stroke-width="14" />
    <path d="M 256,260 L 190,310" stroke-width="8" stroke-dasharray="8 8" />
    <path d="M 256,260 L 322,310" stroke-width="8" stroke-dasharray="8 8" />
  </g>
  
  <!-- Interactive Nodes (representing intelligence) -->
  <circle cx="256" cy="180" r="16" fill="#10b981" filter="url(#glow)" />
  <circle cx="256" cy="260" r="24" fill="#34d399" filter="url(#glow)" />
  <circle cx="190" cy="310" r="12" fill="#10b981" />
  <circle cx="322" cy="310" r="12" fill="#10b981" />
  <circle cx="256" cy="380" r="16" fill="#059669" />
</svg>
